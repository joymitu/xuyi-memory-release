<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>续忆</title>
<style>
@font-face {
  font-family: "Xuyi Hand";
  src: url("font/ZCOOLKuaiLe.ttf") format("truetype");
  font-weight: 400 700;
  font-display: swap;
}
:root {
  --page: #f4f1ea; --ink: #23262d; --ink-2: #6b6f78; --ink-3: #a3a6ad; --line: rgba(35,38,45,.12);
  --card: #fffdf9; --card-line: rgba(35,38,45,.10); --center: #2a2f3a; --center-ink: #f7f3ea;
  --shadow: 0 1px 2px rgba(35,38,45,.06), 0 6px 18px rgba(35,38,45,.07);
  --hand: "Xuyi Hand", "Hannotate SC", "HanziPen SC", "Wawati SC", "Xingkai SC", "STXingkai", "华文行楷", "KaiTi", "楷体", "Kaiti SC", cursive;
  --serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
  --sans: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  --b0: #8a7bd1; --b1: #4fa58c; --b2: #d08a4e; --b3: #5d8fd0; --b4: #c96f8a; --b5: #8c9a5a; --b6: #9a8f80;
}
@media (prefers-color-scheme: dark) {
  :root { --page: #15171c; --ink: #ebe6dc; --ink-2: #a19b90; --ink-3: #6d6a64; --line: rgba(235,230,220,.12);
    --card: #1e2128; --card-line: rgba(235,230,220,.10); --center: #ebe6dc; --center-ink: #1b1d22;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.35); }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); }
body { min-height: 100vh; background-image: radial-gradient(rgba(127,120,105,.07) 1px, transparent 1px); background-size: 22px 22px; }
header { display: flex; align-items: center; gap: 18px; padding: 22px 32px 6px; flex-wrap: wrap; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 0; letter-spacing: .04em; }
.who { display: flex; gap: 6px; flex-wrap: wrap; }
.who button { font: 13px var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; transition: all .2s; }
.who button.on { color: var(--center-ink); background: var(--center); border-color: var(--center); }
.stats { margin-left: auto; color: var(--ink-2); font-size: 13px; letter-spacing: .02em; }
.stats b { color: var(--ink); font-weight: 500; font-size: 15px; margin: 0 2px; }
main { display: grid; grid-template-columns: 230px minmax(0, 1fr) 230px; gap: 8px; padding: 6px 24px 40px; min-height: calc(100vh - 80px); }
.col { display: flex; flex-direction: column; gap: 26px; padding-top: 34px; }
.col.right { padding-top: 70px; }
#map { width: 100%; height: 100%; min-height: 560px; }
.note { position: relative; width: 196px; padding: 22px 16px 14px; font-family: var(--hand); font-size: 18.5px; line-height: 1.5;
  color: #241c12; letter-spacing: .01em; border-radius: 2px 2px 14px 2px / 2px 2px 6px 2px; transform: rotate(var(--tilt));
  box-shadow: 0 1px 1px rgba(0,0,0,.08), 0 10px 18px -6px rgba(60,48,20,.28);
  opacity: 0; animation: drop .6s cubic-bezier(.2,.8,.3,1) forwards; animation-delay: var(--delay); cursor: default; }
.note::before { content: ""; position: absolute; top: -9px; left: 50%; width: 70px; height: 20px; transform: translateX(-50%) rotate(-3deg);
  background: rgba(255,255,255,.55); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.note::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(170deg, rgba(255,255,255,.16), rgba(255,255,255,0) 45%, rgba(0,0,0,.03)); }
.note small { display: block; margin-top: 8px; font-size: 13px; color: rgba(36,28,18,.6); }
.note .acts { display: flex; gap: 6px; margin-top: 8px; }
.note .acts button { font: inherit; font-size: 12px; padding: 2px 7px; cursor: pointer; border: 1px solid rgba(36,28,18,.28); border-radius: 6px; background: rgba(255,255,255,.55); }
.note.recall { background: #fbe9a6; } .note.confirm { background: #f8cfd6; } .note.followup { background: #cfe4f6; } .note.plan { background: #d6ecc9; }
/* 便利贴样式轮换：方头胶带、圆角图钉、横线纸、虚线便签，方向也各不相同。 */
.note.v0 { background: #fbe9a6; }
.note.v1 { background: #f8cfd6; border-radius: 14px 14px 16px 16px / 10px 10px 18px 18px; padding-top: 26px; }
.note.v1::before { width: 14px; height: 14px; border-radius: 50%; top: -8px; left: 50%;
  background: radial-gradient(circle at 35% 30%, #ef6f7d, #a8333f); box-shadow: 0 2px 3px rgba(0,0,0,.3); }
.note.v2 { background-color: #d9e9f8; background-image: repeating-linear-gradient(transparent 0 23px, rgba(90,130,170,.22) 23px 24px); }
.note.v3 { background: #dcecc9; border: 1px dashed rgba(70,100,45,.4); border-radius: 3px; }
.note.v4 { background: #f3e2c7; border-radius: 2px 14px 2px 14px; }
.note.v4::before { width: 46px; height: 14px; background: rgba(255,255,255,.5); transform: translateX(-50%) rotate(8deg); }
/* 鼠标放上去不要动：便利贴是贴在纸上的，不该有悬停动画。 */
.note:hover { cursor: default; }
@keyframes drop { from { opacity: 0; transform: translateY(-14px) rotate(calc(var(--tilt) * 3)); } to { opacity: 1; transform: rotate(var(--tilt)); } }
.empty { font-family: var(--hand); color: var(--ink-3); font-size: 16px; padding: 10px 6px; }
svg text { font-family: var(--sans); }
.leaf { cursor: pointer; }
.leaf rect.bg { fill: var(--card); stroke: var(--card-line); transition: all .2s; }
.leaf:hover rect.bg, .leaf:focus-visible rect.bg, .leaf.open rect.bg { stroke: var(--accent); stroke-width: 1.5; }
.leaf:focus { outline: none; }
.leaf .label { font-size: 11px; fill: var(--ink-3); letter-spacing: .06em; }
.leaf .value { font-size: 15px; fill: var(--ink); font-weight: 500; }
.leaf .was { font-size: 11.5px; fill: var(--ink-3); text-decoration: line-through; }
.leaf.sensitive .value { filter: blur(4px); }
.leaf.sensitive.open .value { filter: none; }
.edge { fill: none; stroke-width: 1.4; stroke-linecap: round; opacity: .55; stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
  animation: draw .9s ease forwards; animation-delay: var(--delay); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade { opacity: 0; animation: fade .5s ease forwards; animation-delay: var(--delay); }
@keyframes fade { to { opacity: 1; } }
#detail { position: fixed; right: 28px; bottom: 28px; width: 320px; background: var(--card); border: 1px solid var(--card-line);
  border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; display: none; z-index: 5; }
#detail.on { display: block; animation: fade .2s ease forwards; }
#detail h3 { margin: 0 0 2px; font: 500 13px var(--sans); color: var(--ink-3); letter-spacing: .06em; }
#detail .v { font: 500 20px var(--serif); margin: 2px 0 12px; }
#detail blockquote { margin: 0 0 6px; padding: 8px 12px; border-left: 2px solid var(--accent, var(--ink-3)); font: 15px var(--hand); color: var(--ink); }
#detail .d { font-size: 12px; color: var(--ink-3); margin-bottom: 10px; }
#detail .old blockquote { color: var(--ink-3); text-decoration: line-through; border-left-color: var(--line); }
#detail .x { position: absolute; top: 10px; right: 12px; border: 0; background: none; color: var(--ink-3); font-size: 18px; cursor: pointer; }
#detail .tag { display: inline-block; font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; margin-bottom: 10px; }
.export { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.export button { font: 12px var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.export button:hover { color: var(--ink); border-color: var(--ink-3); }
.stats { margin-left: 0; }
.tabs button { font: 13px var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 14px; cursor: pointer; transition: all .2s; }
.tabs button.on { color: var(--center-ink); background: var(--center); border-color: var(--center); }

main.diary { display: block; position: relative; padding: 12px 0 70px; min-height: calc(100vh - 90px); }
.spine { position: fixed; left: 22px; top: 118px; width: 178px; max-height: 66vh; overflow: auto;
  display: flex; flex-direction: column; gap: 4px; }
.spine button { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; border: 0;
  background: transparent; color: var(--ink-2); font: 14px var(--sans); padding: 8px 10px; border-radius: 8px;
  cursor: pointer; text-align: left; width: 100%; }
.spine button:hover { background: rgba(127,120,105,.08); }
.spine button.on { background: rgba(35,38,45,.07); color: var(--ink); }
.spine button b { font-weight: 500; color: var(--ink); }
.spine .cnt { font-size: 12px; color: var(--ink-3); }
.desk { position: relative; width: min(700px, calc(100vw - 460px)); margin: 0 auto; }
.sheet { position: relative; background: #fffdf7; border: 1px solid var(--card-line); border-radius: 4px;
  box-shadow: var(--shadow); padding: 36px 42px 46px 46px; min-height: 62vh; }
.sheet::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: linear-gradient(#e6d6a4, #d3bf87); opacity: .55; border-radius: 4px 0 0 4px; }
.desk { perspective: 1600px; }
.sheet { transform-origin: left center; transition: transform .18s ease-in, opacity .18s ease-in; }
.sheet.turn-out { transform: rotateY(-9deg) translateX(-6px); opacity: .3; }
.sheet.turn-in { animation: turnIn .32s cubic-bezier(.2,.7,.3,1) both; }
@keyframes turnIn { from { transform: rotateY(10deg); opacity: .15; } to { transform: none; opacity: 1; } }
.page-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 26px;
  padding-top: 12px; border-top: 1px dashed var(--line); }
.page-nav button { font: 13px var(--sans); color: var(--ink-2); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
.page-nav button:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-3); }
.page-nav button:disabled { opacity: .35; cursor: default; }
.page-nav .no { font-size: 12px; color: var(--ink-3); letter-spacing: .08em; }
.sheet h2 { font-family: var(--hand); font-weight: 400; font-size: 25px; margin: 0 0 4px; letter-spacing: .06em; }
.sheet .meta { color: var(--ink-3); font-size: 13px; margin-bottom: 20px; }
.sheet .empty { color: var(--ink-3); font: 16px var(--hand); }
.entry p { margin: 0 0 1.05em; font-family: var(--hand); font-size: 17.5px; line-height: 1.9;
  color: #241c12; text-indent: 2em; }
.entry p:last-child { margin-bottom: .4em; }
.entry.empty { font-family: var(--hand); color: var(--ink-3); font-size: 16px; line-height: 1.7; }
details.raw { margin-top: 26px; border-top: 1px dashed var(--line); padding-top: 12px; }
details.raw summary { cursor: pointer; color: var(--ink-3); font-size: 13px; list-style: none; }
details.raw summary::-webkit-details-marker { display: none; }
details.raw summary::before { content: "▸ "; }
details.raw[open] summary::before { content: "▾ "; }
.lines { list-style: none; margin: 8px 0 0; padding: 0; }
.lines li { display: grid; grid-template-columns: 50px 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.lines li:last-child { border-bottom: 0; }
.lines time { font-size: 12px; color: var(--ink-3); padding-top: 5px; font-variant-numeric: tabular-nums; }
.lines p { margin: 0; font-family: var(--hand); font-size: 16.5px; line-height: 1.55; color: #241c12; word-break: break-word; }
.page-notes { position: absolute; inset: 0; pointer-events: none; }
.page-notes .side { position: absolute; top: 18px; width: 186px; display: flex; flex-direction: column;
  gap: 26px; pointer-events: auto; }
.page-notes .side.left { right: calc(100% + 18px); }
.page-notes .side.right { left: calc(100% + 18px); }
.page-notes .note { width: 186px; animation: none; opacity: 1; }
.page-notes .empty { font-family: var(--hand); color: var(--ink-3); font-size: 15px; line-height: 1.6; }

/* 嵌在 DSH 左侧栏右边的主区域时常见这个宽度：日期目录挪到顶部，便利贴变窄，仍贴在纸页左右两边。 */
@media (max-width: 1180px) {
  :root { --note-w: clamp(118px, 15vw, 170px); }
  main.diary { padding: 8px 18px 60px; }
  /* 日期目录改成横排时换行，不要一条横向滚动条（真机看着像进度条，很丑）。 */
  .spine { position: static; width: auto; max-height: none; flex-direction: row; flex-wrap: wrap;
    overflow: visible; padding-bottom: 8px; }
  .spine::-webkit-scrollbar { display: none; }
  .spine button { flex: 0 0 auto; }
  .desk { width: min(680px, calc(100vw - 2 * (var(--note-w) + 14px) - 36px)); }
  .sheet { padding: 30px 28px 38px 32px; }
  .page-notes .side { width: var(--note-w); gap: 18px; }
  .page-notes .side.left { right: calc(100% + 14px); }
  .page-notes .side.right { left: calc(100% + 14px); }
  .page-notes .note { width: var(--note-w); font-size: 15.5px; padding: 18px 11px 11px; }
}
/* 真的很窄（手机、分屏）才把便利贴放到纸页下面。 */
@media (max-width: 760px) {
  .desk { width: auto; max-width: 720px; }
  .page-notes { position: static; display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
  .page-notes .side { position: static; width: auto; flex-direction: row; flex-wrap: wrap; gap: 20px; }
  .page-notes .note { width: 170px; }
}

@media (max-width: 980px) { main { grid-template-columns: 1fr; } .col { flex-direction: row; flex-wrap: wrap; padding-top: 10px; } .col.right { padding-top: 0; } }
@media (prefers-reduced-motion: reduce) { .note, .edge, .fade { animation: none; opacity: 1; stroke-dashoffset: 0; } }
.settled .note, .settled .edge, .settled .fade { animation: none; opacity: 1; stroke-dashoffset: 0; }
.settled .note { transform: rotate(var(--tilt)); }
/* 首次引导（只在 DSH 里出现：/xuyi/setup/state 可用时） */
.setup-open { font: 12px var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 3px 10px; cursor: pointer; }
.setup { position: fixed; inset: 0; z-index: 60; background: rgba(35,38,45,.55); display: flex; align-items: flex-start;
  justify-content: center; overflow: auto; padding: 48px 16px; }
.setup-card { position: relative; width: min(760px, 100%); background: var(--card); border: 1px solid var(--card-line);
  border-radius: 16px; box-shadow: var(--shadow); padding: 28px 30px 26px; }
.setup-card h2 { font: 500 22px var(--serif); margin: 0 0 4px; letter-spacing: .04em; }
.setup-card .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 18px; }
.setup-card .x { position: absolute; top: 14px; right: 16px; border: 0; background: none; color: var(--ink-3); font-size: 20px; cursor: pointer; }
.step { border-top: 1px dashed var(--line); padding: 16px 0 6px; }
.step h3 { font: 500 16px var(--sans); margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.step h3 .n { color: var(--ink-3); font-size: 13px; }
.step h3 .ok { color: #3f8f5a; font-size: 13px; font-weight: 400; }
.step p { margin: 0 0 10px; color: var(--ink-2); font-size: 14px; line-height: 1.7; }
.step.off { opacity: .55; }
.btn { font: 14px var(--sans); color: var(--center-ink); background: var(--center); border: 1px solid var(--center);
  border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.btn.ghost { color: var(--ink); background: transparent; border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: wait; }
.presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 6px 0 12px; }
.preset { display: flex; flex-direction: column; align-items: flex-start; border: 1px solid var(--card-line);
  background: var(--page); border-radius: 10px; padding: 9px 12px; }
.preset-choice { flex: 1; width: 100%; padding: 0; border: 0; text-align: left; background: transparent;
  cursor: pointer; font: 13px/1.5 var(--sans); color: var(--ink-2); }
.preset b { display: block; color: var(--ink); font-weight: 500; font-size: 14px; margin-bottom: 2px; }
.preset.on { border-color: var(--center); box-shadow: inset 0 0 0 1px var(--center); }
.preset-detail { margin-top: 6px; padding: 3px 9px; font-size: 12px; }
.persona-editor { border: 1px solid var(--card-line); border-radius: 10px; padding: 12px; margin: 0 0 12px; }
.persona-editor label { display: block; color: var(--ink); font-weight: 600; margin-bottom: 4px; }
.persona-editor textarea { min-height: 12em; }
.persona-editor-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.own { width: 100%; min-height: 76px; resize: vertical; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px;
  padding: 9px 12px; font: 14px/1.6 var(--sans); color: var(--ink); background: var(--page); margin-bottom: 8px; }
.say { font-size: 13px; color: var(--ink-2); min-height: 1.4em; margin-top: 6px; }
.say.bad { color: #b0413e; }
.hour { font: 14px var(--sans); color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; margin-right: 8px; }
.prep { font-size: 13px; color: var(--ink-2); background: var(--page); border-radius: 10px; padding: 8px 12px; margin: -6px 0 14px; }
.prep p { margin: 0; }
.prep details { margin-top: 6px; }
.prep summary { cursor: pointer; }

/* ---- 续忆：页头、页签 ---- */
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand .tagline { font: 15px var(--hand); color: var(--ink-3); letter-spacing: .04em; }
.tabs { display: flex; gap: 6px; }
.view-memory .export, .view-settings .export, .view-memory .stats, .view-settings .stats { display: none; }

/* ---- TA的记忆 ---- */
.mem, .settings { display: block; min-height: 0; }
.mem { max-width: 760px; margin: 0 auto; padding: 18px 20px 70px; }
.mem-sheet { background: #fffdf7; border: 1px solid var(--card-line); border-radius: 6px; box-shadow: var(--shadow);
  padding: 30px 34px 22px; position: relative; }
.mem-sheet::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: linear-gradient(#e6d6a4, #d3bf87); opacity: .55; border-radius: 6px 0 0 6px; }
.mem-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
.mem-head h2 { font: 400 25px var(--hand); margin: 0; letter-spacing: .06em; color: #241c12; }
.mem-head span { color: var(--ink-3); font-size: 13px; }
.mem-hint { color: var(--ink-3); font-size: 13px; margin: 0 0 18px; }
.mem-group { margin-top: 18px; }
.mem-group h3 { font: 400 17px var(--hand); color: #8a6d3b; margin: 0 0 4px; letter-spacing: .08em; }
.mem-row { border-bottom: 1px dashed var(--line); }
.mem-row:last-child { border-bottom: 0; }
.mem-line { display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; gap: 12px; align-items: center; width: 100%;
  padding: 11px 2px; background: none; border: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.mem-line:hover .mem-v { color: #000; }
.mem-label { display: block; font-size: 12px; color: var(--ink-3); letter-spacing: .04em; margin-bottom: 1px; }
.mem-v { font: 500 17px var(--serif); color: var(--ink); transition: color .15s; }
.mem-was { font-size: 12.5px; color: var(--ink-3); margin-left: 8px; font-family: var(--sans); font-weight: 400; }
.mem-quiet { font-size: 12px; color: var(--ink-3); margin-left: 8px; font-family: var(--sans); font-weight: 400; }
.mem-sensitive .mem-v { filter: blur(5px); transition: filter .2s; }
.mem-sensitive.open .mem-v, .mem-sensitive:hover .mem-v { filter: none; }
.chev { color: var(--ink-3); transition: transform .2s; font-size: 12px; }
.mem-row.open .chev { transform: rotate(90deg); }
.pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; white-space: nowrap; letter-spacing: .02em; }
.pill.clear { background: #e3f0de; color: #2f6a35; }
.pill.fuzzy { background: #f8ecd2; color: #8a5a12; }
.pill.fading { background: rgba(127,120,105,.12); color: var(--ink-3); }
.pill.pinned { background: #e6e2f7; color: #4b3f99; }
.pill.muted { background: rgba(127,120,105,.08); color: var(--ink-3); border: 1px dashed var(--line); }
.mem-row.fading .mem-v { color: var(--ink-3); }
.mem-detail { display: none; padding: 2px 2px 14px 2px; animation: fade .2s ease forwards; }
.mem-row.open .mem-detail { display: block; }
.mem-detail blockquote { margin: 4px 0 4px; padding: 8px 14px; border-left: 2px solid #d3bf87; font: 16.5px/1.6 var(--hand);
  color: #241c12; background: rgba(230,214,164,.13); border-radius: 0 8px 8px 0; }
.mem-detail .when { font-size: 12px; color: var(--ink-3); margin-bottom: 10px; }
.mem-detail .old blockquote { color: var(--ink-3); text-decoration: line-through; border-left-color: var(--line); background: none; }
.mem-acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.chip { font: 13px var(--sans); color: var(--ink-2); background: transparent; border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 13px; cursor: pointer; transition: all .15s; }
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip.on { color: var(--center-ink); background: var(--center); border-color: var(--center); }
.chip.warn:hover { color: #b0413e; border-color: #e3a4a2; }
.mem-empty { font: 16px/1.8 var(--hand); color: var(--ink-3); padding: 18px 0 8px; }
.mem-forgot { margin-top: 22px; }
.mem-forgot summary { cursor: pointer; color: var(--ink-3); font-size: 13px; list-style: none; }
.mem-forgot summary::-webkit-details-marker { display: none; }
.mem-forgot .mem-line { cursor: default; }
.carry { margin-top: 22px; background: var(--card); border: 1px solid var(--card-line); border-radius: 14px; padding: 18px 22px; }
.carry h3 { font: 400 18px var(--hand); margin: 0 0 4px; color: #241c12; letter-spacing: .06em; }
.carry p { margin: 0 0 12px; color: var(--ink-2); font-size: 13.5px; line-height: 1.7; }
.carry .row { display: flex; gap: 8px; flex-wrap: wrap; }
.carry .result { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }
.carry .result.good { color: #2f6a35; } .carry .result.bad { color: #b0413e; }

/* ---- 引导：一步一屏 ---- */
.wiz-progress { display: flex; gap: 6px; margin: 4px 0 22px; }
.wiz-progress span { flex: 1; height: 4px; border-radius: 4px; background: var(--line); transition: background .3s; }
.wiz-progress span.done { background: #8fbf8a; } .wiz-progress span.now { background: var(--center); }
.wiz-step { display: block; animation: fade .25s ease forwards; }
.wiz-kicker { font-size: 12.5px; color: var(--ink-3); letter-spacing: .1em; margin-bottom: 4px; }
.wiz-step h3 { font: 500 21px var(--serif); margin: 0 0 8px; letter-spacing: .03em; }
.wiz-step p { margin: 0 0 14px; color: var(--ink-2); font-size: 14.5px; line-height: 1.75; }
.wiz-qr { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin: 6px 0 14px; }
.wiz-qr img { width: 180px; height: 180px; background: #fff; border-radius: 12px; padding: 10px; border: 1px solid var(--card-line); }
.wiz-foot { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-top: 14px; border-top: 1px dashed var(--line); }
.wiz-foot .later { margin-left: auto; border: 0; background: none; color: var(--ink-3); font: 13px var(--sans); cursor: pointer; }
.wiz-wait { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13.5px; }
.wiz-wait::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #8fbf8a; animation: pulse 1.4s ease infinite; }
@keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
.setup-card:has(.wiz-complete) { width: min(600px, 100%); padding: clamp(22px, 5vw, 36px); }
.wiz-complete { text-align: center; padding: 10px 0 4px; }
.wiz-complete h3 { font-size: clamp(23px, 4.5vw, 32px); line-height: 1.35; margin: 0 0 16px; text-wrap: balance; }
.wiz-complete p { max-width: 34em; margin: 0 auto 24px; text-wrap: pretty; }
.wiz-complete .wiz-complete-copy span { display: block; }
.wiz-complete .btn { min-height: 44px; padding-inline: 22px; }
.wiz-complete .wiz-local-note { border-top: 1px solid var(--line); margin: 24px auto 0; padding-top: 14px;
  font-size: 12.5px; }
.wiz-memory-mark { width: 74px; height: 66px; position: relative; margin: 0 auto 20px; color: #4c745a; }
.wiz-memory-mark::before, .wiz-memory-mark span { position: absolute; width: 44px; height: 35px;
  border: 1px solid currentColor; border-radius: 12px 12px 12px 3px; content: ""; }
.wiz-memory-mark::before { left: 9px; top: 8px; background: var(--page); transform: rotate(-10deg);
  --mark-entry-x: -10px; animation: wiz-memory-arrive .5s ease-out both; }
.wiz-memory-mark span { right: 8px; bottom: 9px; background: #e8f0e6; transform: rotate(8deg);
  --mark-entry-x: 10px; animation: wiz-memory-arrive .5s .13s ease-out both; }
.wiz-memory-mark span::after { content: ""; position: absolute; left: 11px; top: 11px; width: 19px; height: 8px;
  border-block: 1px solid currentColor; opacity: .75; }
@keyframes wiz-memory-arrive {
  from { opacity: 0; translate: var(--mark-entry-x) 5px; }
  to { opacity: 1; translate: 0 0; }
}
@media (prefers-color-scheme: dark) {
  .wiz-memory-mark { color: #a9c7ad; }
  .wiz-memory-mark span { background: #26382e; }
}
@media (prefers-reduced-motion: reduce) {
  .wiz-step, .wiz-memory-mark::before, .wiz-memory-mark span { animation: none; }
}
.wiz-step .checks { color: #2f6a35; background: #eef6ea; border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }

/* ---- 设置页 ---- */
.settings { max-width: 760px; margin: 0 auto; padding: 18px 20px 70px; }
.settings .setup-card { width: 100%; }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>续忆</h1><span class="tagline">TA记得你说过的话</span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="diary" class="on">日记本</button>
    <button data-tab="memory">TA的记忆</button>
    <button data-tab="settings" id="tabSettings" hidden>设置</button>
  </nav>
  <div class="who" id="who"></div>
  <div class="export" id="export">
    <button data-format="md">导出 Markdown</button>
    <button data-format="docx">导出 Word</button>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main class="diary" id="diaryView">
  <aside class="spine" id="spine"></aside>
  <div class="desk">
    <article class="sheet" id="sheet"></article>
    <div class="page-notes" id="pageNotes"></div>
  </div>
</main>
<main class="mem" id="memoryView" hidden></main>
<main class="settings" id="settingsView" hidden>
  <div class="setup-card">
    <h2>设置</h2>
    <div class="prep" id="prepStatus" hidden>
      <p id="prepLine"></p>
      <details id="prepDetails" hidden>
        <summary>技术详情</summary>
        <p id="prepReason"></p>
      </details>
    </div>
    <section class="step" id="stepPersona"></section>
    <section class="step" id="stepDiary"></section>
    <section class="step" id="stepAgain"></section>
  </div>
</main>
<div class="setup" id="setup" hidden>
  <div class="setup-card" role="dialog" aria-label="开始使用续忆">
    <button class="x" id="setupClose" title="稍后再说">×</button>
    <div id="wizIntro">
      <h2>欢迎用续忆</h2>
      <p class="sub">弄好这几步，就能在 QQ 上找TA聊天了。</p>
    </div>
    <div class="wiz-progress" id="wizProgress"></div>
    <section class="wiz-step" id="wizStep"></section>
  </div>
</div>
<script>
// 路径一律相对：单独打开时页面在 /，嵌进 DSH 时在 /xuyi/ 下（口令由 DSH 那边代加，页面里没有）。
const token = new URLSearchParams(location.search).get('t');
const withToken = path => token ? path + (path.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(token) : path;
const api = path => fetch(withToken(path)).then(r => r.json());
// 嵌在 DSH 面板里时，按 Esc 让外层把日记本收起来。
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && window.parent !== window) window.parent.postMessage({ type: 'xuyi-diary-close' }, '*');
});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
let current = null;

async function load(scope) {
  current = scope;
  document.querySelectorAll('.who button').forEach(b => b.classList.toggle('on', b.dataset.scope === scope));
  const [data, book] = await Promise.all([
    api('api/board?scope=' + encodeURIComponent(scope)),
    api('api/diary?scope=' + encodeURIComponent(scope)),
  ]);
  if (data.error) { document.getElementById('stats').textContent = '读取失败：' + data.error; return; }
  boardData = data;
  if (!document.getElementById('memoryView').hidden) renderMemory();
  document.getElementById('stats').innerHTML = `认识 <b>${data.center.days}</b> 天 · 聊过 <b>${data.center.messages}</b> 句`;
  setBook(book);
  watchNotes(scope, data.notes_pending);
}

let diaryData = null, currentDay = null, dayTimer = null;

function setBook(book) {
  diaryData = book && !book.error ? book : null;
  const days = diaryData?.days ?? [];
  const spine = document.getElementById('spine');
  spine.innerHTML = '';
  if (!days.length) {
    document.getElementById('sheet').innerHTML = '<h2>还没有日记</h2><div class="meta">多聊几句，这里就会一页页记下来。</div>';
    document.getElementById('pageNotes').innerHTML = '';
    return;
  }
  const keep = days.some(day => day.date === currentDay) ? currentDay : days[0].date;
  for (const day of days) {
    const button = document.createElement('button');
    button.dataset.date = day.date;
    button.innerHTML = `<b>${esc(day.date.slice(5))}</b>`
      + `<span class="cnt">${esc(day.weekday)}${day.label ? ' · ' + esc(day.label) : ''}</span>`;
    button.onclick = () => showDay(day.date);
    spine.appendChild(button);
  }
  showDay(keep, false);
}

const wait = ms => new Promise(done => setTimeout(done, ms));
let flipping = false;

async function showDay(dateStr, animate = true) {
  const day = diaryData?.days.find(entry => entry.date === dateStr);
  if (!day) return;
  const previous = currentDay;
  currentDay = dateStr;
  document.querySelectorAll('#spine button').forEach(b => b.classList.toggle('on', b.dataset.date === dateStr));
  const one = await api('api/diary?scope=' + encodeURIComponent(current) + '&date=' + dateStr);
  if (currentDay !== dateStr || one.error) return;
  const sheet = document.getElementById('sheet');
  const flip = animate && previous && previous !== dateStr && !flipping;
  if (flip) {
    flipping = true;
    sheet.classList.add('turn-out');
    await wait(180);
  }
  renderDay(day, one.diary_text, one.diary_pending, one.diary_today, one.diary_hour);
  if (flip) {
    sheet.classList.remove('turn-out');
    void sheet.offsetWidth;
    sheet.classList.add('turn-in');
    setTimeout(() => { sheet.classList.remove('turn-in'); flipping = false; }, 360);
  }
  if (!one.diary_text && one.diary_pending) pollDay(dateStr, Date.now());
}

const hourText = hour => {
  const h = Number.isInteger(hour) ? hour : 22;
  const words = ['零', '一', '两', '三', '四', '五', '六', '七', '八', '九', '十', '十一'];
  return (h >= 18 ? '晚上' : h >= 12 ? '下午' : '') + words[h > 12 ? h - 12 : h] + '点';
};

function renderDay(day, text, pending, isToday = false, hour = 22) {
  const [, month, date] = day.date.split('-').map(Number);
  const raw = day.entries.map(entry => `<li><time>${esc(entry.time)}</time><p>${esc(entry.text)}</p></li>`).join('');
  const note = pending ? 'TA正在写这一页……'
    : isToday ? `今天还没写日记。先贴便利贴，${hourText(hour)}TA会把今天写成日记，写完就不再改了。`
    : '这一页还没写。开 DSH 并配置好人设，TA就会写。';
  const entry = text
    ? text.split(/\n\s*\n/).map(part => `<p>${esc(part)}</p>`).join('')
    : `<p>${note}</p>`;
  const days = diaryData?.days ?? [];
  const index = days.findIndex(item => item.date === day.date);
  const nav = index < 0 ? '' : `<div class="page-nav">
      <button data-go="older" ${index < days.length - 1 ? '' : 'disabled'}>‹ 前一天</button>
      <span class="no">${index + 1} / ${days.length}</span>
      <button data-go="newer" ${index > 0 ? '' : 'disabled'}>后一天 ›</button>
    </div>`;
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `<h2>${month} 月 ${date} 日</h2>`
    + `<div class="meta">${esc(day.weekday)} · 聊了 ${day.count} 句</div>`
    + `<div class="entry">${entry}</div>`
    + (raw ? `<details class="raw"><summary>那天的原话（${day.entries.length} 句）</summary><ol class="lines">${raw}</ol></details>` : '')
    + nav;
  sheet.querySelectorAll('.page-nav button').forEach(button => {
    if (button.disabled) return;
    button.onclick = () => {
      const target = days[index + (button.dataset.go === 'older' ? 1 : -1)];
      if (target) showDay(target.date);
    };
  });
  renderNotes(day.notes ?? []);
}

function renderNotes(notes) {
  const box = document.getElementById('pageNotes');
  if (!notes.length) {
    box.innerHTML = '<div class="side right"><div class="empty">这天没有要补的批注。</div></div>';
    return;
  }
  // 左右各贴一些，像真的贴在纸页两边；样式与角度轮换，别都一个方向。
  const sides = { left: [], right: [] };
  notes.forEach((note, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    // 左边的往左歪、右边的往右歪，幅度小一点，看着像随手贴的，不是斜着摔上去的。
    const tilt = (side === 'left' ? -1 : 1) * (1.8 + (i % 3) * 1.1);
    const shade = note.strength == null ? 1 : (0.55 + 0.45 * note.strength);
    const acts = note.event_id
      ? `<span class="acts">`
        + `<button data-id="${esc(note.event_id)}" data-act="${note.pinned ? 'unpin' : 'pin'}">${note.pinned ? '不置顶了' : '一直记着'}</button>`
        + `<button data-id="${esc(note.event_id)}" data-act="${note.muted ? 'unmute' : 'mute'}">${note.muted ? '可以提了' : '别再提了'}</button>`
        + `</span>`
      : '';
    sides[side].push(`<div class="note v${i % 5} ${esc(note.kind)}" data-id="${esc(note.event_id || '')}" style="--tilt:${tilt.toFixed(1)}deg;opacity:${shade.toFixed(2)}">`
      + `${esc(note.text)}${note.at ? `<small>${esc(String(note.at).slice(5, 16).replace('T', ' '))}</small>` : ''}${acts}</div>`);
  });
  box.innerHTML = `<div class="side left">${sides.left.join('')}</div>`
    + `<div class="side right">${sides.right.join('')}</div>`;
  box.querySelectorAll('button[data-act]').forEach(btn => {
    btn.onclick = async () => {
      const body = { scope: current, event_id: btn.dataset.id };
      const act = btn.dataset.act;
      if (act === 'pin') body.pinned = true;
      if (act === 'unpin') body.pinned = false;
      if (act === 'mute') body.muted = true;
      if (act === 'unmute') body.muted = false;
      const res = await fetch(withToken('api/override'), { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (res.ok) location.reload();
    };
  });
}

function pollDay(dateStr, started) {
  clearTimeout(dayTimer);
  dayTimer = setTimeout(async () => {
    if (currentDay !== dateStr) return;
    const one = await api('api/diary?scope=' + encodeURIComponent(current) + '&date=' + dateStr);
    if (one.error || currentDay !== dateStr) return;
    const day = diaryData?.days.find(entry => entry.date === dateStr);
    if (one.diary_text) { renderDay(day, one.diary_text, false, one.diary_today, one.diary_hour); return; }
    if (one.diary_pending && Date.now() - started < 50000) pollDay(dateStr, started);
  }, 1800);
}

// 便利贴由宿主模型写：先显示模板，写好后再悄悄换上，不刷新整页。
let noteTimer = null;
function watchNotes(scope, pending) {
  clearTimeout(noteTimer);
  if (!pending) return;
  const started = Date.now();
  const tick = async () => {
    if (current !== scope) return;
    try {
      const data = await api('api/board?scope=' + encodeURIComponent(scope));
      if (data.error || current !== scope) return;
      if (data.notes_source === 'model') {
        const book = await api('api/diary?scope=' + encodeURIComponent(scope));
        if (!book.error && current === scope) setBook(book);
        return;
      }
      if (data.notes_pending && Date.now() - started < 20000) noteTimer = setTimeout(tick, 1800);
    } catch { /* 看板只读，网络抖动就等下次打开 */ }
  };
  noteTimer = setTimeout(tick, 1800);
}

// ← → 翻页（← 更早，→ 更新）。
document.addEventListener('keydown', event => {
  if (!diaryData || !currentDay || (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight')) return;
  if (event.target.closest?.('input, textarea, select, [contenteditable]')) return;
  const days = diaryData.days;
  const index = days.findIndex(day => day.date === currentDay);
  const target = days[index + (event.key === 'ArrowLeft' ? 1 : -1)];
  if (target) { event.preventDefault(); showDay(target.date); }
});

// ---- 引导与设置：只在 DSH 里可用（单独打开的看板没有 setup 接口，「设置」页签不出现） ----
let setupState = null, bindState = null;
const setupPost = (path, body) => fetch(path, { method: 'POST',
  headers: { 'Content-Type': 'application/json', 'X-Xuyi-Setup': '1' }, body: JSON.stringify(body ?? {}) })
  .then(async r => ({ ok: r.ok, data: await r.json().catch(() => ({})) }))
  .catch(() => ({ ok: false, data: { error: '连不上续忆，稍后再试' } }));
const loadSetup = () => fetch('setup/state').then(r => r.ok ? r.json() : null).catch(() => null);
// 腾讯 QQ 插件自己的绑定状态（同一个 DSH 下同源）：bound / waiting（带二维码）/ starting / failed。
// 页面单独打开、或 QQ 插件还没生效时拿不到，就退回「去 QQ 机器人页面扫码」。
const loadBind = () => fetch('/qqbot/im-qqbot/bind', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : null).catch(() => null);

function say(id, text, bad = false) {
  const box = document.getElementById(id);
  if (box) { box.textContent = text; box.classList.toggle('bad', bad); }
}

function renderPrepare(p) {
  const status = document.getElementById('prepStatus');
  status.hidden = !p || Boolean(p.bundled);
  if (status.hidden) return;

  const line = document.getElementById('prepLine');
  const details = document.getElementById('prepDetails');
  const reason = document.getElementById('prepReason');
  details.hidden = p.stage !== 'failed' || !p.error;
  if (details.hidden) details.open = false;
  reason.textContent = details.hidden ? '' : p.error;
  line.textContent = p.ready ? '续忆可以按意思查找以前的聊天。'
    : p.stage === 'failed' ? '续忆目前按关键词查找以前的聊天。QQ 聊天和记录照常使用。'
    : p.stage === 'disabled' ? '已关闭中文模型的自动准备。'
    : p.stage === 'verify' ? '正在检查中文模型，暂时按关键词查找以前的聊天。'
    : `正在准备中文模型（${p.percent || 0}%），暂时按关键词查找以前的聊天。`;
}

// 选TA的样子（人设 + 群里怎么回）：设置页和引导共用。
function personaBlock(box, sayId, { kicker = '', onSaved } = {}) {
  const s = setupState;
  const choices = s.presets ?? [];
  const editorId = `${sayId}Editor`, detailSayId = `${sayId}Detail`;
  const presets = choices.map((p, i) => `<div class="preset${s.persona?.name === p.name ? ' on' : ''}">`
    + `<button class="preset-choice" data-name="${esc(p.name)}"><b>${esc(p.label)}</b>${esc(p.description)}</button>`
    + (typeof p.systemPrompt === 'string' && p.systemPrompt.trim()
      ? `<button class="btn ghost preset-detail" data-detail="${i}" aria-label="查看${esc(p.label)}的详情" aria-expanded="false" aria-controls="${editorId}">查看详情</button>` : '')
    + '</div>').join('');
  const saved = s.persona?.configured;
  const current = saved ? `已保存<b>${esc(s.persona.label)}</b>。`
    + (bindState?.phase === 'bound' ? '' : '绑定 QQ 后会使用这份人设。') : '';
  box.innerHTML = (kicker ? `<div class="wiz-kicker">${kicker}</div><h3>选TA的样子</h3>`
      : `<h3>TA的样子${saved ? '<span class="ok">✓ 已保存</span>' : ''}</h3>`)
    + `<p>${current}挑一个，或者自己写几句：TA是什么性格、跟你什么关系、说话什么样。</p>`
    + `<div class="presets">${presets}</div>`
    + `<div class="persona-editor" id="${editorId}" hidden>`
    + `<label for="${editorId}Text"></label><p>可以直接修改。改过的内容会作为自定义人设使用，原预设会保留。</p>`
    + `<textarea class="own" id="${editorId}Text" maxlength="4000"></textarea>`
    + '<div class="persona-editor-actions"><button class="btn" data-save-detail>保存并使用</button>'
    + '<button class="btn ghost" data-close-detail>取消</button></div>'
    + `<div class="say" role="status" id="${detailSayId}"></div></div>`
    + '<textarea class="own" data-own-text placeholder="也可以自己写：TA是什么性格、和你什么关系、说话什么样……"></textarea>'
    + '<button class="btn ghost" data-own>用我写的</button>'
    + `<p style="margin-top:12px">群里：<select class="hour" data-group>`
    + `<option value="mention"${s.persona?.group_reply !== 'all' ? ' selected' : ''}>有人 @ TA才回</option>`
    + `<option value="all"${s.persona?.group_reply === 'all' ? ' selected' : ''}>每条都可能接话</option>`
    + `</select></p><div class="say" role="status" id="${sayId}"></div>`;
  const group = box.querySelector('[data-group]');
  const editor = box.querySelector('.persona-editor');
  const editorText = editor.querySelector('textarea');
  const saveDetail = editor.querySelector('[data-save-detail]');
  let active = null, saving = false;
  const choose = async (body, statusId = sayId) => {
    if (saving) return;
    if (!setupState.qq?.installed) { say(statusId, '先装 QQ 插件。', true); return; }
    saving = saveDetail.disabled = true;
    try {
      say(statusId, '正在保存……');
      const { ok, data } = await setupPost('setup/persona', { ...body, groupReply: group.value });
      if (!ok) { say(statusId, data.error || '没保存上', true); return; }
      await refreshSetup();
      if (!onSaved) personaBlock(box, sayId);
      say(onSaved ? statusId : sayId, `好，换成「${data.applied}」了。在 QQ 里发一句 /new 就生效，不行就重启 DSH。`);
      onSaved?.();
    } finally {
      saving = saveDetail.disabled = false;
    }
  };
  box.querySelectorAll('[data-name]').forEach(button => { button.onclick = () => choose({ name: button.dataset.name }); });
  box.querySelectorAll('[data-detail]').forEach(button => {
    button.onclick = () => {
      if (saving) return;
      if (active === button) { editorText.focus(); return; }
      active?.setAttribute('aria-expanded', 'false');
      active = button;
      active.setAttribute('aria-expanded', 'true');
      const preset = choices[button.dataset.detail];
      editor.querySelector('label').textContent = `${preset.label} · 完整设定`;
      editorText.value = preset.systemPrompt;
      say(detailSayId, '');
      editor.hidden = false;
      editorText.focus();
    };
  });
  editor.querySelector('[data-close-detail]').onclick = () => {
    if (saving || !active) return;
    editor.hidden = true;
    editorText.value = '';
    active.setAttribute('aria-expanded', 'false');
    active.focus();
    active = null;
  };
  saveDetail.onclick = () => {
    if (!active) return;
    const text = editorText.value.trim();
    if (!text) { say(detailSayId, '人设内容不能为空。', true); editorText.focus(); return; }
    const preset = choices[active.dataset.detail];
    return choose(text === preset.systemPrompt.trim() ? { name: preset.name } : { text }, detailSayId);
  };
  box.querySelector('[data-own]').onclick = () => {
    const text = box.querySelector('[data-own-text]').value.trim();
    if (!text) { say(sayId, '先写几句。', true); return; }
    choose({ text });
  };
  group.onchange = () => {
    // 现在用的是预设：按同一个预设重新保存（带上新的群聊设置）；自己写的要重新点「用我写的」。
    if (active) say(detailSayId, '保存人设时会一起保存群聊设置。');
    else if (setupState.persona?.name) choose({ name: setupState.persona.name });
    else say(sayId, '选人设的时候会一起存这项。');
  };
}

function hourBlock(box) {
  const s = setupState;
  const hours = s.diary_hours ?? [18, 19, 20, 21, 22, 23];
  const chosen = Number.isInteger(s.diary_hour) ? s.diary_hour : 22;
  box.innerHTML = `<h3>每天几点写日记</h3>`
    + `<p>到点TA就把当天写成一篇日记，写完不改。那时候 DSH 没开，第二天补上。</p>`
    + `<select class="hour">${hours.map(h => `<option value="${h}"${h === chosen ? ' selected' : ''}>${hourText(h)}</option>`).join('')}</select>`
    + '<div class="say" id="sayDiary"></div>';
  box.querySelector('select').onchange = async event => {
    say('sayDiary', '正在保存……');
    const { ok, data } = await setupPost('setup/diary-hour', { hour: Number(event.target.value) });
    if (!ok) { say('sayDiary', data.error || '没保存上', true); return; }
    setupState.diary_hour = data.diary_hour;
    say('sayDiary', `好，以后每天${hourText(data.diary_hour)}写日记。`);
  };
}

function renderSettings() {
  if (!setupState) return;
  renderPrepare(setupState.prepare);
  personaBlock(document.getElementById('stepPersona'), 'sayPersona');
  hourBlock(document.getElementById('stepDiary'));
  const again = document.getElementById('stepAgain');
  again.innerHTML = '<h3>重新走一遍引导</h3><p>换了机器人、换了电脑，或者想从头看一遍。</p>'
    + '<button class="btn ghost">打开引导</button>';
  again.querySelector('button').onclick = () => openWizard(true);
}

async function refreshSetup() {
  const [state, bind] = await Promise.all([loadSetup(), loadBind()]);
  if (state && !state.error) setupState = state;
  if (bind?.phase) scanAcknowledged = false;
  bindState = bind;
}

// ---- 引导：从装好续忆那一刻开始，一步一屏，做完自动往下走 ----
const WIZ_STEPS = ['qq', 'scan', 'persona', 'hello', 'done'];
const flag = (key, value) => { try { if (value === undefined) return sessionStorage.getItem(key); sessionStorage.setItem(key, value); } catch { return null; } };
let wizTimer = null, wizShown = null;
// 从「设置」手动打开：从第 1 步逐屏走（上一步 / 下一步），做完的步骤显示 ✓，想改的当屏改。
// 新用户装好后自动弹出的引导不走这个：直接停在第一个没做完的步骤，做完自动往下走。
let wizManual = null;
let scanAcknowledged = false;

function scanDone() {
  const phase = bindState?.phase;
  return phase ? phase === 'bound' : scanAcknowledged;
}

function qrImageSource(svg) {
  if (typeof svg !== 'string') return '';
  // QQ 插件的新版本已返回图片地址，旧格式的 SVG 文本才需要编码。
  if (/^data:image\/svg\+xml;base64,[A-Za-z0-9+/]+={0,2}$/.test(svg)) return svg;
  return /^\s*<svg[\s>]/.test(svg) ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) : '';
}

function stepDone(step) {
  const s = setupState, health = s.health ?? {};
  if (step === 'qq') return Boolean(s.qq?.installed);
  if (step === 'scan') return scanDone();
  if (step === 'persona') return Boolean(s.persona?.configured);
  if (step === 'hello') return Boolean(health.recording && health.recall);
  return true;
}

// 「用上了」不看 QQ 那边，看续忆自己：私聊的话进了续忆的档案（recording），拿那句话能想起来（recall）。
function wizardStep() {
  const s = setupState, health = s.health ?? {};
  if (wizManual !== null) {
    const step = WIZ_STEPS[wizManual];
    return step === 'hello' && health.recording && !health.recall ? 'check' : step;
  }
  if (!s.qq?.installed) return 'qq';
  if (!scanDone()) return 'scan';
  if (!s.persona?.configured) return 'persona';
  if (!health.recording) return 'hello';
  if (!health.recall) return 'check';
  return 'done';
}

function dismissWizard() {
  if (wizManual === null) flag('xuyi-wizard-later', wizardStep());
  closeWizard();
}

let helloSince = null;

function renderWizard(force = false) {
  const step = wizardStep();
  // 轮询时只有状态真的变了才重画：不然刚点完的按钮、刚出来的提示、正在填的字都会被刷掉。
  // 等第一句话等太久（QQ 那边聊上了、续忆却没收到）要换成「卡住了」那一屏。
  if (step !== 'hello') helloSince = null; else helloSince ??= Date.now();
  const stuck = step === 'hello' && setupState.chatted && Date.now() - helloSince > 20000;
  const signature = step + '|' + (step === 'scan' ? `${bindState?.phase}|${bindState?.issuedAt}` : '') + (stuck ? '|stuck' : '')
    + (wizManual !== null ? `|m${wizManual}|${stepDone(step)}` : '');
  if (!force && signature === wizShown) return;
  wizShown = signature;
  document.getElementById('wizIntro').hidden = step === 'done';
  const index = WIZ_STEPS.indexOf(step === 'check' ? 'hello' : step);
  const progress = document.getElementById('wizProgress');
  progress.hidden = step === 'done';
  progress.innerHTML = WIZ_STEPS.slice(0, 4)
    .map((_, i) => `<span class="${i < index ? 'done' : i === index ? 'now' : ''}"></span>`).join('');
  const box = document.getElementById('wizStep');
  const manual = wizManual !== null;
  const navButtons = manual
    ? (wizManual > 0 ? '<button class="btn ghost" data-prev>上一步</button>' : '')
      + (stepDone(step === 'check' ? 'hello' : step) && step !== 'done' ? '<button class="btn" data-next>下一步</button>' : '')
      + '<button class="later" data-later>关闭</button>'
    : '<button class="later" data-later>稍后再说</button>';
  const later = `<div class="wiz-foot">${navButtons}</div>`;
  const s = setupState, qq = s.qq ?? {};
  const kickers = { qq: '第 1 步 · 连上 QQ', scan: '第 2 步 · 扫码', hello: '第 4 步 · 打个招呼' };
  if (manual && ['qq', 'scan', 'hello'].includes(step) && stepDone(step)) {
    const h = s.health ?? {};
    const done = {
      qq: ['QQ 机器人插件', '✓ 已经装好了。'],
      scan: ['扫码绑定', '✓ 已经绑定好了。想换一个机器人，去 QQ 机器人页面重新扫码。'],
      hello: ['跟TA说句话', `✓ 续忆已经收到你的消息了${h.messages ? `（${h.messages} 句）` : ''}，也想得起来。`],
    }[step];
    box.innerHTML = `<div class="wiz-kicker">${kickers[step]}</div><h3>${done[0]}</h3><p class="checks">${done[1]}</p>`
      + (step === 'scan' ? '<p><button class="btn ghost" data-open>打开 QQ 机器人页面</button></p>' : '') + later;
    const open = box.querySelector('[data-open]');
    if (open) open.onclick = () => { if (window.parent !== window) window.parent.postMessage({ type: 'xuyi-open-qq' }, '*'); };
  } else if (step === 'qq') {
    box.innerHTML = '<div class="wiz-kicker">第 1 步 · 连上 QQ</div><h3>装一下 QQ 机器人插件</h3>'
      + '<p>TA靠腾讯官方的 QQ 插件收发消息。点一下就装，一分钟左右。</p>'
      + (qq.canInstall ? '<button class="btn" data-install>一键安装</button>'
        : '<p>请打开左侧「插件」，点「添加插件」，填 <b>@tencent-connect/dsh-qqbot</b>，装好后回到这里。</p>')
      + '<div class="say" id="sayQq"></div>' + later;
    const install = box.querySelector('[data-install]');
    if (install) install.onclick = async () => {
      install.disabled = true;
      say('sayQq', '正在安装，大概要一分钟……');
      const { ok, data } = await setupPost('setup/install-qq');
      if (!ok) { install.disabled = false; say('sayQq', data.error || '没装上', true); return; }
      if (data.restart) {
        say('sayQq', '装好了。把 DSH 完全退出（右下角托盘图标也退掉）再打开，会回到这一步。');
        return;
      }
      await refreshSetup();
      if (wizManual === 0 && setupState.qq?.installed && !scanDone()) wizManual = WIZ_STEPS.indexOf('scan');
      renderWizard(true);
    };
  } else if (step === 'scan') {
    const phase = bindState?.phase;
    const qrSrc = phase === 'waiting' ? qrImageSource(bindState.qrSvg) : '';
    const qr = qrSrc
      ? '<div class="wiz-qr"><img alt="QQ 机器人绑定二维码">'
        + '<div><p>用<b>手机 QQ</b> 扫一下，照提示建好机器人。</p><span class="wiz-wait">扫完会自己跳到下一步</span></div></div>'
      : phase === 'starting' || phase === 'saving' ? '<p><span class="wiz-wait">二维码马上就好……</span></p>'
      : phase === 'failed' ? `<p class="say bad">二维码没出来（${esc(bindState.reason || '原因不明')}），去 QQ 机器人页面再试一次。</p>`
      : '<p>去 QQ 机器人页面用手机 QQ 扫码，扫好了回来点「扫好了」。</p>';
    box.innerHTML = '<div class="wiz-kicker">第 2 步 · 扫码</div><h3>用手机 QQ 扫码，建好你的机器人</h3>' + qr
      + '<div class="wiz-foot"><button class="btn ghost" data-open>打开 QQ 机器人页面</button>'
      + (!phase ? '<button class="btn ghost" data-ack>扫好了</button>' : '') + navButtons + '</div>'
      + '<div class="say" id="sayScan"></div>';
    if (qrSrc) {
      const image = box.querySelector('.wiz-qr img');
      image.onerror = () => {
        image.hidden = true;
        say('sayScan', '二维码显示失败，请打开 QQ 机器人页面扫码。', true);
      };
      image.src = qrSrc;
    }
    box.querySelector('[data-open]').onclick = () => {
      if (window.parent === window) { say('sayScan', '在 DSH 左侧找到「QQ 机器人」，用手机 QQ 扫码。'); return; }
      window.parent.postMessage({ type: 'xuyi-open-qq' }, '*');
    };
    const ack = box.querySelector('[data-ack]');
    if (ack) ack.onclick = () => { scanAcknowledged = true; renderWizard(true); };
  } else if (step === 'persona') {
    box.innerHTML = '<div data-persona></div>' + later;
    personaBlock(box.querySelector('[data-persona]'), 'sayWizPersona',
      { kicker: '第 3 步 · TA的样子', onSaved: () => setTimeout(() => renderWizard(true), manual ? 0 : 900) });
  } else if (step === 'hello' && stuck) {
    box.innerHTML = '<div class="wiz-kicker">第 4 步 · 打个招呼</div><h3>QQ 连上了，续忆还没收到</h3>'
      + '<p>你在 QQ 上已经和机器人聊过了，但续忆这边没有记下来，TA现在记不住东西。一般是续忆没加载上：</p>'
      + '<p>1. 看一眼左侧「插件」，续忆是不是「已启用」。<br>2. 把 DSH 完全退出（右下角托盘图标也退掉）再打开，然后在 QQ 上再说一句。'
      + '<br>3. 还不行的话，原因记在 <b>~/.xuyi/data/adapter-errors.log</b>，把这个文件发给开发者。</p>'
      + '<span class="wiz-wait">还在等续忆收到消息……</span>' + later;
  } else if (step === 'hello') {
    box.innerHTML = '<div class="wiz-kicker">第 4 步 · 打个招呼</div><h3>用手机 QQ 跟TA说句话</h3>'
      + '<p>在 QQ 里找到刚建好的机器人，说句「在吗」就行。续忆收到了，这里会自己往下走。</p>'
      + '<span class="wiz-wait">等你说第一句……</span>' + later;
  } else if (step === 'check') {
    box.innerHTML = '<div class="wiz-kicker">最后一步 · 检查</div><h3>收到了，正在整理</h3>'
      + '<p>续忆已经收到你的消息，正在建索引，几秒钟就好。一直停在这里的话，把 DSH 完全退出再打开。</p>'
      + '<span class="wiz-wait">整理中……</span>' + later;
  } else {
    box.innerHTML = '<div class="wiz-complete"><div class="wiz-memory-mark" aria-hidden="true"><span></span></div>'
      + '<h3>信息予你无限，续忆重塑未来</h3>'
      + '<p class="wiz-complete-copy"><span>恭喜，续忆已经记下了你在 QQ 发来的消息。</span>'
      + '<span>下次提起以前聊过的事，续忆能帮 DeepSeek 接上话。</span></p>'
      + '<button class="btn" data-finish>看看 TA 的记忆</button>'
      + '<p class="wiz-local-note">记忆保存在本机。到「TA的记忆」点「备份」，随时可以导出完整记忆。</p></div>'
      + (manual ? later : '');
    box.querySelector('[data-finish]').onclick = () => { closeWizard(); showTab('memory'); };
  }
  box.querySelectorAll('[data-later]').forEach(b => { b.onclick = dismissWizard; });
  box.querySelectorAll('[data-prev]').forEach(b => { b.onclick = () => { wizManual -= 1; renderWizard(true); }; });
  box.querySelectorAll('[data-next]').forEach(b => { b.onclick = () => { wizManual += 1; renderWizard(true); }; });
}

function openWizard(manual = false) {
  wizManual = manual ? 0 : null;
  document.getElementById('setup').hidden = false;
  renderWizard(true);
  clearInterval(wizTimer);
  // 等安装生效、等扫码、等第一句话：每 3 秒看一眼，做完自动往下走。
  wizTimer = setInterval(async () => {
    if (document.getElementById('setup').hidden) { clearInterval(wizTimer); return; }
    await refreshSetup();
    renderWizard();
  }, 3000);
}

function closeWizard() {
  document.getElementById('setup').hidden = true;
  clearInterval(wizTimer);
  if (current) load(current);
}

async function initSetup() {
  await refreshSetup();
  if (!setupState) return;
  document.getElementById('tabSettings').hidden = false;
  document.getElementById('setupClose').onclick = dismissWizard;
  const step = wizardStep();
  if (step !== 'done' && flag('xuyi-wizard-later') !== step) openWizard();
}

// ---- TA的记忆 ----
let boardData = null;
const CLARITY = { '清楚': 'clear', '有点模糊': 'fuzzy', '快忘了': 'fading', '一直记着': 'pinned' };

function memoryRow(item, forgotten = false) {
  const pill = item.muted && !forgotten ? '<span class="pill muted">不主动提</span>'
    : `<span class="pill ${CLARITY[item.clarity] || 'clear'}">${esc(item.clarity || '清楚')}</span>`;
  const was = item.history?.length ? `<span class="mem-was">以前：${esc(item.history.at(-1).quote)}</span>` : '';
  const quiet = item.sensitive ? '<span class="mem-quiet">只在你提到时才说</span>' : '';
  const old = (item.history ?? []).map(h => `<div class="old"><blockquote>${esc(h.quote)}</blockquote><div class="when">${esc(h.date)}</div></div>`).join('');
  const acts = forgotten
    ? `<button class="chip" data-act="restore">恢复</button>`
    : `<button class="chip${item.pinned ? ' on' : ''}" data-act="${item.pinned ? 'unpin' : 'pin'}">${item.pinned ? '✓ 一直记着' : '一直记着'}</button>`
      + `<button class="chip${item.muted ? ' on' : ''}" data-act="${item.muted ? 'unmute' : 'mute'}">${item.muted ? '✓ 别再提了' : '别再提了'}</button>`
      + `<button class="chip warn" data-act="wrong">这条记错了</button>`;
  return `<div class="mem-row${item.sensitive ? ' mem-sensitive' : ''}${item.clarity === '快忘了' ? ' fading' : ''}" data-id="${esc(item.event_id)}">`
    + `<button class="mem-line"><span><span class="mem-label">${esc(item.label)}</span>`
    + `<span class="mem-v">${esc(item.value)}</span>${was}${quiet}</span>${pill}<span class="chev">▸</span></button>`
    + `<div class="mem-detail"><blockquote>${esc(item.quote)}</blockquote><div class="when">你的原话 · ${esc(item.date)}</div>${old}`
    + `<div class="mem-acts">${acts}</div></div></div>`;
}

function renderMemory() {
  const view = document.getElementById('memoryView');
  const groups = boardData?.memory ?? [];
  const forgotten = boardData?.forgotten ?? [];
  const count = groups.reduce((n, g) => n + g.items.length, 0);
  const body = groups.length
    ? groups.map(g => `<section class="mem-group"><h3>${esc(g.name)}</h3>${g.items.map(i => memoryRow(i)).join('')}</section>`).join('')
    : '<div class="mem-empty">还没记下什么。跟TA多聊几句，你喜欢什么、约了什么，会出现在这里。</div>';
  const forgot = forgotten.length
    ? `<details class="mem-forgot"><summary>▸ 你让TA忘掉的（${forgotten.length}）</summary>${forgotten.map(i => memoryRow(i, true)).join('')}</details>` : '';
  view.innerHTML = `<div class="mem-sheet"><div class="mem-head"><h2>TA记得的你</h2><span>${count ? `共 ${count} 件` : ''}</span></div>`
    + '<p class="mem-hint">右边是TA记得多清楚：常提的、最近说的清楚，好久没提的会慢慢模糊。点开能看到你当时的原话。</p>'
    + body + forgot + '</div>'
    + '<div class="carry"><h3>带走TA的记忆</h3>'
    + '<p>换电脑或重装前先备份一下，到新电脑装好续忆再导入，TA就还记得你。</p>'
    + '<div class="row"><button class="chip" data-carry="backup">备份</button>'
    + '<button class="chip" data-carry="import">导入</button>'
    + '<button class="chip" data-carry="check">检查TA还记得吗</button>'
    + '<input type="file" accept=".json,application/json" hidden></div><div class="result" id="carryResult"></div></div>';
  view.querySelectorAll('.mem-line').forEach(line => {
    line.onclick = () => line.parentElement.classList.toggle('open');
  });
  view.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = async event => {
      event.stopPropagation();
      const id = btn.closest('.mem-row').dataset.id;
      const act = btn.dataset.act;
      const body = { scope: current, event_id: id };
      if (act === 'pin' || act === 'unpin') body.pinned = act === 'pin';
      if (act === 'mute' || act === 'unmute') body.muted = act === 'mute';
      if (act === 'wrong' || act === 'restore') body.wrong = act === 'wrong';
      if (act === 'wrong' && !confirm('标成记错了以后，TA不会再想起这条。原话还留着，随时能恢复。确定？')) return;
      const res = await fetch(withToken('api/override'), { method: 'POST',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (res.ok) await load(current, 'memory');
    };
  });
  const result = (text, kind = '') => { const box = document.getElementById('carryResult'); box.textContent = text; box.className = 'result ' + kind; };
  const file = view.querySelector('input[type=file]');
  view.querySelector('[data-carry=backup]').onclick = () => { location.href = withToken('api/backup'); };
  view.querySelector('[data-carry=import]').onclick = () => file.click();
  file.onchange = async () => {
    const chosen = file.files?.[0];
    if (!chosen) return;
    result('正在导入……');
    let packed;
    try { packed = JSON.parse(await chosen.text()); } catch { result('打不开，这不是续忆的备份文件。', 'bad'); return; }
    const res = await fetch(withToken('api/restore'), { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Xuyi-Setup': '1' }, body: JSON.stringify(packed) })
      .then(async r => ({ ok: r.ok, data: await r.json().catch(() => ({})) })).catch(() => ({ ok: false, data: {} }));
    if (!res.ok) { result(res.data.error || '没导进去。', 'bad'); return; }
    result(`导入好了：${res.data.contacts} 个聊天，新加 ${res.data.inserted} 句，重复的 ${res.data.duplicate} 句没动。`, 'good');
    await load(current, 'memory');
  };
  view.querySelector('[data-carry=check]').onclick = async () => {
    result('正在查……');
    const report = await api('api/selfcheck?scope=' + encodeURIComponent(current)).catch(() => null);
    if (!report || report.error) { result('没检查成：' + (report?.error || '连不上续忆'), 'bad'); return; }
    if (!report.checked) { result('TA还没记下什么，没东西可查。'); return; }
    if (!report.missed.length) { result(`${report.checked} 件都还记得。`, 'good'); return; }
    result(`${report.ok}/${report.checked} 件还记得；这几件没想起来：`
      + report.missed.map(m => `${m.label}（${m.value}）`).join('、') + '。原话还在，跟TA再提一次就行。', 'bad');
  };
}

// ---- 页签 ----
function showTab(name) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  document.getElementById('diaryView').hidden = name !== 'diary';
  document.getElementById('memoryView').hidden = name !== 'memory';
  document.getElementById('settingsView').hidden = name !== 'settings';
  document.body.className = 'view-' + name;
  if (name === 'memory') renderMemory();
  if (name === 'settings') { refreshSetup().then(renderSettings); }
  try { sessionStorage.setItem('xuyi-tab', name); } catch {}
}
document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => showTab(b.dataset.tab); });

(async () => {
  initSetup();
  const people = await api('api/contacts');
  const who = document.getElementById('who');
  let remembered = null;
  try { remembered = sessionStorage.getItem('xuyi-tab'); } catch {}
  // 地址带 #memory / #settings 时直接打开那一页（截图、说明里的链接用）。
  const wanted = location.hash.slice(1) || remembered;
  if (wanted === 'memory' || wanted === 'settings') showTab(wanted);
  if (!people.length) {
    document.getElementById('stats').textContent = '还没有 QQ 私聊记录';
    document.getElementById('sheet').innerHTML = '<h2>还没有日记</h2><div class="meta">在 QQ 里和TA聊几句，这里就会一页页记下来。</div>';
    renderMemory();
    return;
  }
  // 只有一个好友时不摆一排按钮，省得看着乱。
  if (people.length < 2) who.style.display = 'none';
  people.forEach(p => {
    const b = document.createElement('button');
    b.textContent = p.label; b.dataset.scope = p.scope; b.onclick = () => load(p.scope);
    who.appendChild(b);
  });
  // 导出当前好友的整本日记：直接走下载，不经过页面数据。
  document.querySelectorAll('#export button').forEach(button => {
    button.onclick = () => {
      if (!current) return;
      location.href = withToken('export?scope=' + encodeURIComponent(current)
        + '&format=' + button.dataset.format);
    };
  });
  load(people[0].scope);
})();
</script>
